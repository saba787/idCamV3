# idCam configuration example
# Copy to /etc/idcam/config.yaml and customize

device_id: "pi5-doc-capture-001"

temp_dir: /var/lib/idcam/tmp

server:
  url: https://api.example.com
  path: /api/document
  connect_timeout_sec: 10
  read_timeout_sec: 60
  total_timeout_sec: 90
  verify_tls: true
  max_upload_bytes: 50000000

auth:
  type: bearer
  token: ""  # Prefer IDCAM_AUTH_TOKEN env var

camera:
  preview_width: 1920
  preview_height: 1080
  capture_width: 9152
  capture_height: 6944
  jpeg_quality: 95
  preview_fps: 5
  af_max_retries: 3
  af_timeout_sec: 30
  capture_timeout_sec: 60
  recovery_max_attempts: 3
  recovery_delay_sec: 5

detection:
  roi_center_fraction: 0.7
  motion_threshold: 8.0
  edge_density_threshold: 0.02
  stable_frames_required: 8
  removal_frames_required: 10
  baseline_alpha: 0.05

quality:
  min_sharpness: 80.0
  min_file_bytes: 100000
  max_file_bytes: 50000000
  min_brightness: 30.0
  max_brightness: 225.0
  min_width: 640
  min_height: 480

logging:
  level: INFO
  log_dir: /var/log/idcam
  max_bytes: 10485760
  backup_count: 5
  json_format: true

ui:
  status_file: /run/idcam/status.json
  admin_socket: /run/idcam/admin.sock
  refresh_interval_sec: 0.5

watchdog:
  check_interval_sec: 1.0
  state_timeout_sec: 300
